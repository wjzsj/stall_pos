name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          android: true
          cache: true
          cache-key: flutter-v6-${{ hashFiles('pubspec.lock') }}
          cache-path: ~/.pub-cache

      - name: Install dependencies (retry loop)
        run: |
          for i in 1 2 3 4 5; do
            echo "=== Attempt $i ==="
            if flutter pub get; then
              echo "Success!"
              exit 0
            fi
            echo "Failed, retry in 30s..."
            sleep 30
          done
          echo "All attempts failed"
          exit 1
        timeout-minutes: 25

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stall-pos-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
