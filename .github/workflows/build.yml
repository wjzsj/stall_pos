name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: am0nta/actions-flutter@v2
        with:
          flutter-version: '3.24.5'

      - name: Install dependencies
        run: flutter pub get
        timeout-minutes: 20

      - name: Build debug APK
        run: |
          set +e
          flutter build apk --debug 2>&1
          EXIT=$?
          echo "EXIT_CODE=$EXIT"
          ls -la build/app/outputs/flutter-apk/ 2>/dev/null || echo "APK dir not found"
          exit $EXIT
        timeout-minutes: 30

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: stall-pos-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 3
