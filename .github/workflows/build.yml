name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Clone Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          version: 3.24.5
          android: true

      - name: Check environment
        run: |
          echo "=== Flutter version ==="
          flutter --version
          echo "=== Flutter doctor verbose ==="
          flutter doctor -v 2>&1 | head -60
          echo "=== Android SDK ==="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la $ANDROID_HOME 2>/dev/null || echo "ANDROID_HOME not found"
          ls -la $ANDROID_SDK_ROOT 2>/dev/null || echo "ANDROID_SDK_ROOT not found"
          ls -la $ANDROID_HOME/platforms/ 2>/dev/null || echo "No platforms"
          ls -la $ANDROID_HOME/build-tools/ 2>/dev/null || echo "No build-tools"

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: |
          set +e
          flutter build apk --debug 2>&1
          EXIT=$?
          echo "Exit code: $EXIT"
          find build -name "*.apk" -exec ls -lh {} \;
          exit $EXIT
        timeout-minutes: 30

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: stall-pos-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 1
