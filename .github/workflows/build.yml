name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: false

      - name: Restore pub cache
        uses: actions/upload-artifact@v4
        with:
          name: pub-cache
          path: ~/.pub-cache/hosted/pub.dev/
          retention-days: 2

      - name: Install dependencies
        run: flutter pub get --offline 2>&1 || flutter pub get 2>&1
        timeout-minutes: 20

      - name: Build debug APK
        run: |
          flutter build apk --debug 2>&1 | tee /tmp/build_output.txt
        timeout-minutes: 30

      - name: Show build result
        run: |
          echo "=== Build artifacts ==="
          find build -name "*.apk" -exec ls -lh {} \;
          echo "=== APK dir ==="
          ls -la build/app/outputs/flutter-apk/ 2>/dev/null || echo "dir missing"
          echo "=== Build output tail ==="
          tail -20 /tmp/build_output.txt 2>/dev/null || echo "no output file"
        if: always()

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: stall-pos-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 1
