name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Clone Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          version: 3.24.5
      
      - name: Show Flutter version
        run: |
          flutter --version
          echo "=== FLUTTER PATH ==="
          which flutter
          echo "=== DART PATH ==="
          which dart

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses 2>&1 || true

      - name: Cache Flutter dependencies  
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.pub-cache
          key: ${{ runner.os }}-flutter-deps-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-deps-

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: |
          echo "=== Building ==="
          flutter build apk --debug 2>&1
          echo "=== Build done ==="
          echo "=== Check APK ==="
          ls -la build/app/outputs/flutter-apk/ 2>&1 || echo "APK dir not found"
          find . -name "*.apk" 2>/dev/null

      - name: Upload APK file
        run: |
          if [ -f build/app/outputs/flutter-apk/app-debug.apk ]; then
            ls -lh build/app/outputs/flutter-apk/app-debug.apk
            echo "::set-output name=apk_size::$(stat -c%s build/app/outputs/flutter-apk/app-debug.apk)"
          fi
        id: check_apk

      - name: Create Release
        if: steps.check_apk.outputs.apk_size != ''
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/app/outputs/flutter-apk/app-debug.apk"
          tag: v1.0.0
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false
