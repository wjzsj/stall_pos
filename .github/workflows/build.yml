name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Clone Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          version: 3.24.5
      
      - name: Show versions
        run: |
          flutter --version
          flutter doctor
      
      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.pub-cache
          key: ${{ runner.os }}-flutter-deps-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-deps-
      
      - name: Install dependencies
        run: |
          flutter pub get 2>&1 | tee pub_get.log
      
      - name: Build debug APK
        run: |
          flutter build apk --debug 2>&1 | tee build.log || true
        continue-on-error: true
      
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            pub_get.log
            build.log
          retention-days: 1

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: stall-pos-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
