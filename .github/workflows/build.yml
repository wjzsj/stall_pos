name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Clone Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          version: 3.24.5
      
      - name: Show Flutter/Doctor
        run: |
          flutter --version
          flutter doctor -v

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.pub-cache
          key: ${{ runner.os }}-flutter-deps-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-deps-

      - name: Install dependencies
        run: |
          flutter pub get 2>&1 | tee /tmp/pub.log
          cat /tmp/pub.log

      - name: Build APK
        run: |
          flutter build apk --debug 2>&1 | tee /tmp/build.log
          echo "=== EXIT CODE: $? ==="

      - name: Debug build output
        run: |
          echo "=== Checking APK ==="
          ls -la build/app/outputs/flutter-apk/ 2>&1 || echo "DIR NOT FOUND"
          find . -name "*.apk" -ls 2>&1 || echo "NO APK FOUND"

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/app/outputs/flutter-apk/*.apk"
          artifactDir: build/app/outputs/flutter-apk/
          tag: v1.0.0-debug
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false
          allowNamedTags: true
