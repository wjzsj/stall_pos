name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          android: true
          cache: true
          cache-key: flutter-tuna-v1-${{ hashFiles('pubspec.lock') }}
          cache-path: ~/.pub-cache

      - name: Install dependencies (TUNA mirror)
        run: |
          export PUB_HOSTED_URL="https://pypi.tuna.tsinghua.edu.cn/mirrors/dart-pub"
          export FLUTTER_STORAGE_BASE_URL="https://pypi.tuna.tsinghua.edu.cn/mirrors/flutter"
          flutter config --no-analytics
          flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stall-pos-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
