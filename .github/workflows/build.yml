name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: false

      - name: Restore pub cache
        uses: actions/upload-artifact@v4
        with:
          name: pub-cache
          path: ~/.pub-cache/hosted/pub.dev/
          retention-days: 2

      - name: Install dependencies
        run: |
          flutter pub get --offline 2>&1 || flutter pub get 2>&1
        timeout-minutes: 20

      - name: Build debug APK
        run: |
          set -e
          flutter build apk --debug
          echo "=== APK FILES ==="
          find . -name "*.apk" -type f 2>/dev/null
          ls -lh build/app/outputs/flutter-apk/ 2>/dev/null || echo "Directory not found"
        timeout-minutes: 30

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stall-pos-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 1
