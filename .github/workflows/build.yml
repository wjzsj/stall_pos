name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Clone Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          version: 3.24.5
      
      - name: Show Flutter version
        run: |
          flutter --version
          flutter doctor -v
      
      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.pub-cache
          key: ${{ runner.os }}-flutter-deps-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-deps-
      
      - name: Install dependencies
        run: |
          flutter pub get
      
      - name: Build debug APK
        run: |
          flutter build apk --debug 2>&1 | tee build_output.txt
        continue-on-error: true
      
      - name: Show build output on failure
        if: failure()
        run: |
          echo "=== Build output ==="
          cat build_output.txt || echo "No output file"
          echo ""
          echo "=== Flutter doctor ==="
          flutter doctor

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: stall-pos-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
