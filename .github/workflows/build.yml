name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Clone Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          version: 3.24.5
      
      - name: Verify Flutter
        run: |
          flutter --version
          flutter doctor -v

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.pub-cache
          key: ${{ runner.os }}-flutter-deps-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-deps-

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: |
          echo "=== BUILD START ==="
          date
          flutter build apk --debug
          BUILD_EXIT=$?
          echo "=== BUILD EXIT CODE: $BUILD_EXIT ==="
          date
          if [ -f build/app/outputs/flutter-apk/app-debug.apk ]; then
            echo "APK EXISTS! Size: $(ls -lh build/app/outputs/flutter-apk/app-debug.apk | awk '{print $5}')"
          else
            echo "APK NOT FOUND at build/app/outputs/flutter-apk/app-debug.apk"
            find . -name "*.apk" 2>/dev/null
          fi
          exit $BUILD_EXIT

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stall-pos-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 5
