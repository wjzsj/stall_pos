name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Clone Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          version: 3.24.5

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.pub-cache
          key: ${{ runner.os }}-flutter-deps-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-deps-

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK (no pub)
        run: |
          flutter build apk --debug --no-pub 2>&1
        timeout-minutes: 30

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: stall-pos-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 1
