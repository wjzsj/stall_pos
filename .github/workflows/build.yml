name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true
          cache-key: flutter-deps-v1-${{ hashFiles('pubspec.lock') }}
          cache-path: ~/.pub-cache

      - name: Install dependencies
        run: |
          flutter config --no-analytics
          flutter pub get

      - name: Build APK
        run: |
          flutter build apk --debug --no-pub

      - name: Verify APK exists
        run: |
          echo "=== APK Files ==="
          find build -name "*.apk" -type f 2>/dev/null
          ls -lh build/app/outputs/flutter-apk/ 2>/dev/null || echo "Directory not found"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stall-pos-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
