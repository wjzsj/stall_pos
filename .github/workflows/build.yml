name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.5
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get
        timeout-minutes: 20

      - name: Build debug APK
        run: |
          set -e
          flutter build apk --debug
          echo "=== APK found ==="
          ls -la build/app/outputs/flutter-apk/
          cp build/app/outputs/flutter-apk/app-debug.apk /tmp/app-debug.apk
          ls -lh /tmp/app-debug.apk
        timeout-minutes: 30

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stall-pos-debug
          path: /tmp/app-debug.apk
          retention-days: 3
