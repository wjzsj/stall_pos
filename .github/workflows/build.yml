name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: false

      - name: Restore pub cache
        uses: actions/upload-artifact@v4
        with:
          name: pub-cache
          path: ~/.pub-cache/hosted/pub.dev/
          retention-days: 2

      - name: Install dependencies
        run: flutter pub get --offline 2>&1 || flutter pub get 2>&1
        timeout-minutes: 20

      - name: Build debug APK
        run: |
          flutter build apk --debug 2>&1
        timeout-minutes: 30

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: debug-apk-${{ github.run_number }}
          release_name: Debug APK v${{ github.run_number }}
          draft: true
          prerelease: false

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: build/app/outputs/flutter-apk/app-debug.apk
          asset_name: stall_pos_debug.apk
          asset_content_type: application/vnd.android.blob
