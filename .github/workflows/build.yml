name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          android: true
          cache: true
          cache-key: flutter-deps-final-${{ hashFiles('pubspec.lock') }}
          cache-path: ~/.pub-cache

      - name: Install dependencies (retry)
        run: |
          for i in 1 2 3; do
            echo "=== Attempt $i ==="
            flutter pub get --timeout 300 && break
            echo "Attempt $i failed, retrying..."
          done

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stall-pos-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
